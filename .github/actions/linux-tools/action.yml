# Установка инструментов на Linux-раннере для задач CI.
# Зеркала Ubuntu временами отдают пакеты очень медленно (clang-tidy-19 тянет ~100 МБ), поэтому
# скачанные .deb кэшируются между прогонами: обычно докачиваются только обновившиеся пакеты.
# Обрыв соединения ловят тайм-ауты apt; при сбое — ещё две попытки через другие зеркала.
name: Linux tools
description: Install apt packages (cached between runs) and, optionally, the pinned clang-format, with retries

inputs:
  packages:
    description: apt packages to install (space-separated); empty — none
    default: ''
  clang-format:
    description: "'true' — install clang-format 19.1.7 from pip (the developers' version: versions format differently)"
    default: 'false'

runs:
  using: composite
  steps:
    # Ключ — задача и номер прогона: каждый прогон сохраняет свежий набор, а берёт самый свежий из прошлых
    - if: inputs.packages != ''
      uses: actions/cache@v6
      with:
        path: ~/apt-archives
        key: apt-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: apt-${{ runner.os }}-${{ github.job }}-

    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        CLANG_FORMAT: ${{ inputs.clang-format }}
      run: |
        # apt работает только с источниками Ubuntu: сторонние репозитории раннера (Microsoft, PPA)
        # не нужны. Блокировку dpkg (фоновые обновления образа) ждём не дольше минуты
        sources="$RUNNER_TEMP/apt-sources"
        mkdir -p "$sources" ~/apt-archives
        apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        apt_opts="$apt_opts -o DPkg::Lock::Timeout=60 -o APT::Keep-Downloaded-Packages=true"
        apt_opts="$apt_opts -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts=$sources"
        # Первая попытка — зеркала раннера (в ubuntu.sources это «mirror+file:/etc/apt/apt-mirrors.txt»),
        # следующие — другие зеркала
        mirrors="default http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/"
        use_sources() {
          rm -f "$sources"/*
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            cp /etc/apt/sources.list.d/ubuntu.sources "$sources/"
            [ "$1" = default ] || sed -i -E "s#^URIs:.*#URIs: $1#" "$sources/ubuntu.sources"
          else
            grep -E '^deb ' /etc/apt/sources.list > "$sources/ubuntu.list"
            [ "$1" = default ] || sed -i -E "s#^(deb(-src)? +(\[[^]]*\] +)?)[^ ]+#\1$1#" "$sources/ubuntu.list"
          fi
        }
        # Команда с тайм-аутом; при сбое — аннотация с кодом выхода (124 — тайм-аут) и концом вывода
        step() {
          limit=$1; shift
          if timeout "$limit" "$@" > "$RUNNER_TEMP/step.log" 2>&1; then return 0; else code=$?; fi
          echo "::warning title=Install tools::'$*' failed with code $code: $(tail -n 4 "$RUNNER_TEMP/step.log" | tr '\n' ' ' | cut -c1-400)"
          return 1
        }
        install() {
          if [ -n "$PACKAGES" ]; then
            # shellcheck disable=SC2086
            step 120 sudo apt-get $apt_opts update || return 1
            # Медленную, но идущую загрузку не обрываем: зависшее соединение ловят тайм-ауты apt
            # shellcheck disable=SC2086
            step 600 sudo apt-get $apt_opts install -y $PACKAGES || return 1
          fi
          if [ "$CLANG_FORMAT" = true ]; then
            step 120 pip install --user --timeout 30 --retries 3 clang-format==19.1.7 || return 1
          fi
        }
        # Пакеты из кэша — туда, где apt их ищет: скачиваются только недостающие и обновившиеся
        cached=$(find ~/apt-archives -name '*.deb' | wc -l)
        if [ "$cached" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
        attempt=0
        for mirror in $mirrors; do
          attempt=$((attempt + 1))
          use_sources "$mirror"
          install && break
          [ "$attempt" = 3 ] && { echo "::error title=Install tools::package installation failed in 3 attempts"; exit 1; }
          echo "::warning title=Install tools::attempt $attempt failed, switching the package mirror"
          sleep 5
        done
        if [ -n "$PACKAGES" ]; then
          # Для следующих прогонов — ровно то, что понадобилось сейчас
          rm -f ~/apt-archives/*.deb
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          echo "apt: $cached packages from the cache, $(find ~/apt-archives -name '*.deb' | wc -l) kept for the next run"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
