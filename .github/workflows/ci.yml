# Сборка, тесты и пакеты для macOS и Windows; на Linux — проверки кода и фаззинг.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtpositioning qtserialport'

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    env:
      # Подпись Developer ID и нотаризация на macOS (ADR 0019) — только если заданы секреты репозитория;
      # без них пакет подписывается ad hoc, как раньше
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # теги нужны для номера версии (cmake/version.cmake)

      - name: Import the Developer ID certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Временная связка ключей только для этой задачи; codesign получает доступ к ключу без диалога
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error title=Signing::no Developer ID Application identity in MACOS_CERT_P12"; exit 1; }
          echo "UCENTER_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        # Предупреждения как ошибки — кроме MSVC: его /W4 строже и проверен меньше
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUCENTER_WERROR=${{ runner.os == 'Windows' && 'OFF' || 'ON' }}
          -DUCENTER_CODESIGN_IDENTITY="${{ env.UCENTER_CODESIGN_IDENTITY || '-' }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        # Текст упавших тестов — ещё и в аннотацию: её видно без доступа к журналам
        run: |
          if ! ctest --test-dir build --build-config Release --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
            echo "::error title=Tests failed::$(tail -c 4000 ctest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat ctest.log

      - name: Diagnose a failed test start (Windows)
        # Вывод QtTest пишется в файл, а не в консоль, — он не теряется, даже если консоли нет;
        # код выхода 0xC0000135 (-1073741515) — не найдена DLL
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          exe=build/Release/test_core.exe
          code=0
          "$exe" -o diag.txt,txt || code=$?  # bash в Actions запущен с -e: без «||» шаг прервётся здесь
          deps=$(ls build/Release | tr '\n' ' ')
          echo "::error title=test_core exit code $code::files: $deps%0A$(head -c 3000 diag.txt 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Notarize (macOS, tags)
        # Только для релизов: нотаризация занимает минуты, а пакеты веток никто не раздаёт
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.UCENTER_CODESIGN_IDENTITY != '' && env.NOTARY_PASSWORD != ''
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          dmg="$(ls build/package/*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Install and uninstall the MSI (Windows)
        # Чистая Windows раннера: тихая установка, ярлык в «Пуске», запуск установленного приложения
        # (Qt рядом с ним, --measure завершает его сам), тихое удаление — без следов в Program Files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail($text) { Write-Output "::error title=MSI::$text"; exit 1 }
          $msi = (Get-ChildItem build/package/*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi-install.log'
          if ($p.ExitCode -ne 0) { Fail "install exit code $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'UCenter\bin\UCenter.exe'
          if (-not (Test-Path $exe)) { Fail "no $exe after install" }
          # Установка для всех пользователей: ярлык — в общем меню «Пуск», а не в меню того, кто ставил
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          $lnk = Get-ChildItem $menu -Recurse -Filter 'UCenter.lnk' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lnk) { Fail 'no UCenter shortcut in the all-users Start menu' }
          $out = Join-Path $env:RUNNER_TEMP 'installed-run.txt'
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '--measure', '1,3', '--measure-out', "`"$out`""
          if ($r.ExitCode -ne 0 -or -not (Test-Path $out)) { Fail "installed app did not run (exit code $($r.ExitCode))" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'msi-uninstall.log'
          if ($p.ExitCode -ne 0) { Fail "uninstall exit code $($p.ExitCode)" }
          if (Test-Path (Join-Path $env:ProgramFiles 'UCenter')) { Fail 'Program Files\UCenter is left after uninstall' }
          if (Test-Path $lnk.FullName) { Fail 'the Start menu shortcut is left after uninstall' }
          Write-Output "::notice title=MSI::installed to $exe, shortcut $($lnk.FullName), app ran, uninstalled cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: UCenter-${{ runner.os }}
          path: |
            build/package/*.dmg
            build/package/*.zip
            build/package/*.msi
          if-no-files-found: error

  # Проверки на Linux — параллельными задачами: время прогона задаёт самая долгая из них, а не их сумма.
  # Сборки кэшируются ccache (каталог .ccache — между прогонами через actions/cache)
  format:
    name: clang-format (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
        with:
          clang-format: 'true'
      - name: clang-format
        run: clang-format --version && tools/format.sh --check

  sanitizers:
    name: Tests under ASan + UBSan (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: clang
      CXX: clang++
      QT_QPA_PLATFORM: offscreen
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
        with:
          packages: clang ccache libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-sanitizers-${{ github.sha }}
          restore-keys: ccache-sanitizers-

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUCENTER_WERROR=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build --parallel && ccache --show-stats

      - name: Test under sanitizers
        run: |
          if ! ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
            echo "::error title=Tests failed::$(tail -c 4000 ctest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat ctest.log

      - name: Translations are up to date
        # lupdate не должен находить новых или изменённых строк: иначе .ts отстали от кода
        run: |
          cmake --build build --target update_translations
          git diff --exit-code -- translations/

  tidy:
    # Анализ — самая долгая проверка: файлы поделены на три параллельные задачи
    name: clang-tidy ${{ matrix.part }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: core
            files: src/core/.*
          - part: ui
            files: src/ui/.*
          - part: tests
            files: (src/main|tests/.*|fuzz/.*)
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
        with:
          # clang-tidy 19 — как у разработчиков: в версии 18 другой набор проверок
          packages: clang clang-tidy-19 libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      # Компилировать не нужно: clang-tidy нужны только compile_commands.json и файлы moc,
      # которые включают исходники, — их создают цели *_autogen
      - name: Generate moc files
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel --target $(cmake --build build --target help | grep -o '[A-Za-z_]*_autogen' | sort -u)

      - name: clang-tidy
        env:
          CLANG_TIDY: clang-tidy-19
          RUN_CLANG_TIDY: run-clang-tidy-19
        run: |
          if ! tools/clang_tidy.sh build '${{ matrix.files }}' > tidy.log 2>&1; then
            cat tidy.log
            echo "::error title=clang-tidy::$(grep -E 'warning:|error:' tidy.log | sort -u | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

  fuzz:
    name: Fuzzing (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # На main и тегах — две минуты, на остальных ветках хватает 30 секунд
      FUZZ_SECONDS: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '120' || '30' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tools
        with:
          packages: clang ccache libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-

      - name: Fuzz the frame reader
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DUCENTER_FUZZ=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-fuzz --target fuzz_frame_reader --parallel && ccache --show-stats
          mkdir -p corpus
          build-fuzz/fuzz_frame_reader -max_total_time="$FUZZ_SECONDS" -timeout=10 corpus fuzz/corpus

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  release:
    # Тег v* — черновик релиза GitHub с пакетами macOS и Windows; публикуется вручную после проверки
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, format, sanitizers, tidy, fuzz]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: UCenter-*
          merge-multiple: true
          path: dist

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "UCenter ${GITHUB_REF_NAME#v}" --generate-notes
