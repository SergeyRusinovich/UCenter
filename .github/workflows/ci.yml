# Сборка, тесты и пакеты для macOS и Windows; на Linux — проверки кода и фаззинг.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

env:
  QT_VERSION: '6.8.3'
  QT_MODULES: 'qtpositioning qtserialport'

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # теги нужны для номера версии (cmake/version.cmake)

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Configure
        # Предупреждения как ошибки — кроме MSVC: его /W4 строже и проверен меньше
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DUCENTER_WERROR=${{ runner.os == 'Windows' && 'OFF' || 'ON' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: bash
        # Текст упавших тестов — ещё и в аннотацию: её видно без доступа к журналам
        run: |
          if ! ctest --test-dir build --build-config Release --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
            echo "::error title=Tests failed::$(tail -c 4000 ctest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat ctest.log

      - name: Diagnose a failed test start (Windows)
        # Вывод QtTest пишется в файл, а не в консоль, — он не теряется, даже если консоли нет;
        # код выхода 0xC0000135 (-1073741515) — не найдена DLL
        if: failure() && runner.os == 'Windows'
        shell: bash
        run: |
          exe=build/Release/test_core.exe
          code=0
          "$exe" -o diag.txt,txt || code=$?  # bash в Actions запущен с -e: без «||» шаг прервётся здесь
          deps=$(ls build/Release | tr '\n' ' ')
          echo "::error title=test_core exit code $code::files: $deps%0A$(head -c 3000 diag.txt 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - uses: actions/upload-artifact@v7
        with:
          name: UCenter-${{ runner.os }}
          path: |
            build/package/*.dmg
            build/package/*.zip
          if-no-files-found: error

  checks:
    name: Format, clang-tidy, sanitizers, fuzzing (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # обычно ~10 минут; зависшее зеркало пакетов не должно занимать час
    env:
      CC: clang
      CXX: clang++
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        # Обычно ~20 с, но зеркала пакетов иногда подвисают на десятки минут: у каждой команды
        # тайм-аут, а при срыве — ещё две попытки
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            # clang-tidy 19 — как у разработчиков: в версии 18 другой набор проверок.
            # Та же версия clang-format, что у разработчиков: разные версии форматируют по-разному
            if timeout 180 sudo apt-get $apt_opts update \
              && timeout 300 sudo apt-get $apt_opts install -y \
                   clang clang-tidy-19 libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
              && timeout 120 pip install --user --timeout 30 --retries 3 clang-format==19.1.7; then
              break
            fi
            [ "$attempt" = 3 ] && { echo "::error title=Install tools::package mirrors did not respond in 3 attempts"; exit 1; }
            echo "::warning title=Install tools::attempt $attempt failed or timed out, retrying"
            sleep 15
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: clang-format
        run: clang-format --version && tools/format.sh --check

      - name: Configure (ASan + UBSan)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DUCENTER_WERROR=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test under sanitizers
        run: |
          if ! ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
            echo "::error title=Tests failed::$(tail -c 4000 ctest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
          cat ctest.log

      - name: Translations are up to date
        # lupdate не должен находить новых или изменённых строк: иначе .ts отстали от кода
        run: |
          cmake --build build --target update_translations
          git diff --exit-code -- translations/

      - name: clang-tidy
        env:
          CLANG_TIDY: clang-tidy-19
          RUN_CLANG_TIDY: run-clang-tidy-19
        run: |
          if ! tools/clang_tidy.sh build > tidy.log 2>&1; then
            cat tidy.log
            echo "::error title=clang-tidy::$(grep -E 'warning:|error:' tidy.log | sort -u | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Fuzz the frame reader
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DUCENTER_FUZZ=ON
          cmake --build build-fuzz --target fuzz_frame_reader --parallel
          mkdir -p corpus
          build-fuzz/fuzz_frame_reader -max_total_time=120 -timeout=10 corpus fuzz/corpus

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*
          if-no-files-found: ignore

  release:
    # Тег v* — черновик релиза GitHub с пакетами macOS и Windows; публикуется вручную после проверки
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: UCenter-*
          merge-multiple: true
          path: dist

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag
          --title "UCenter ${GITHUB_REF_NAME#v}" --generate-notes
